# Project identification
sonar.organization=remotemerge
sonar.projectName=nepali-date-converter
sonar.projectKey=nepali-date-converter
sonar.projectVersion=1.0

# Source configuration
sonar.sources=.
sonar.sourceEncoding=UTF-8

# File suffixes
sonar.typescript.file.suffixes=.ts,.tsx

# Coverage configuration
sonar.typescript.lcov.reportPaths=html/coverage/lcov.info

# Exclude directories from analysis
sonar.exclusions=**/node_modules/**,**/dist/**

# Ignore specific rules
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S7031
sonar.issue.ignore.multicriteria.e1.resourceKey=**

