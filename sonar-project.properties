# Project
sonar.organization=remotemerge
sonar.projectName=Nepali Date Converter
sonar.projectKey=nepali-date-converter
sonar.projectVersion=1.0

# Scope
sonar.sources=.
sonar.tests=__tests__
sonar.sourceEncoding=UTF-8

# TypeScript
sonar.typescript.tsconfigPaths=tsconfig.json

# Coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,__tests__/**

# Coverage exclusions
sonar.coverage.exclusions=scripts/**,*.config.ts,index.html

# Ignored issues
sonar.issue.ignore.multicriteria=lockfile
sonar.issue.ignore.multicriteria.lockfile.ruleKey=githubactions:S8543
sonar.issue.ignore.multicriteria.lockfile.resourceKey=.github/workflows/install.yml
