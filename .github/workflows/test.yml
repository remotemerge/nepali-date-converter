name: Test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    # Run on multiple operating systems
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
      fail-fast: false

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Setup Bun runtime"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: "Install dependencies"
        working-directory: html
        run: bun install --ignore-scripts

      - name: "Build project"
        working-directory: html
        run: bun run build

      - name: "Create data file"
        working-directory: html
        run: bun x shx cp __tests__/data.dist.json __tests__/data.json

      - name: "Run tests with coverage"
        working-directory: html
        run: bun run test:coverage

      - name: "SonarQube scan"
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
