name: Test

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    # Run on multiple operating systems
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TZ: ${{ matrix.timezone }}
    strategy:
      matrix:
        timezone: [UTC, America/New_York, America/Los_Angeles, Asia/Kathmandu]
        os: [ ubuntu-24.04, windows-latest, macos-latest ]
      fail-fast: false

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Setup Bun runtime"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: "Install dependencies"
        run: bun install --frozen-lockfile --ignore-scripts

      - name: "Build project"
        run: bun run build

      - name: "Lint"
        run: bun run lint

      - name: "Run tests with coverage"
        run: bun run test:coverage

      - name: "SonarQube scan"
        if: ${{ !cancelled() && matrix.os == 'ubuntu-24.04' && matrix.timezone == 'UTC' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build package
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify packed consumers
        run: bun run test:package
