name: Publish

on:
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check tag matches version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun -e 'const {version} = await Bun.file("package.json").json(); if (![version, `v${version}`].includes(process.env.RELEASE_TAG)) throw new Error("Release tag does not match package version");'

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: |
          for timezone in UTC America/New_York America/Los_Angeles Asia/Kathmandu; do
            TZ="$timezone" bun run test
          done

      - name: Build package
        run: bun run build

      - name: Copy README and LICENSE to dist
        run: cp README.md LICENSE ./dist/

      - name: Test the packed package
        run: bun run test:package

      - name: Publish to npm
        working-directory: dist
        run: npm publish --access public --provenance
