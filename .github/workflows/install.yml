name: Install

on:
  workflow_run:
    workflows: [ Publish ]
    types: [ completed ]

permissions: { }

env:
  # For a release-triggered run, head_branch is the release tag.
  PACKAGE: "@remotemerge/nepali-date-converter@${{ github.event.workflow_run.head_branch }}"

defaults:
  run:
    shell: bash

jobs:
  registry:
    name: Wait for the npm registry
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The npm-registry environment has a 10-minute wait timer. A new version
    # takes about a minute to appear on the registry, and the registry's CDN
    # serves cached package metadata for up to 5 minutes.
    environment: npm-registry

    steps:
      - name: Report the package
        run: echo "Installing $PACKAGE"

  npm:
    name: npm on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}
    needs: registry
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 18.12.0, 20, 22, 24, 26 ]

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install published package
        run: npm init -y && npm install --ignore-scripts "$PACKAGE"

      - name: List installed packages
        run: npm list --depth=0

  yarn:
    name: Yarn on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}
    needs: registry
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        node-version: [ 18.12.0, 20, 22, 24, 26 ]

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install published package
        run: npm init -y && yarn add --ignore-scripts "$PACKAGE"

      - name: List installed packages
        run: yarn list --depth=0

  pnpm:
    name: pnpm on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}
    needs: registry
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 18.12.0, 20, 22, 24, 26 ]

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g --ignore-scripts pnpm@12.10.1

      - name: Install published package
        run: pnpm init && pnpm add --ignore-scripts "$PACKAGE"

      - name: List installed packages
        run: pnpm list --depth=0

  bun:
    name: Bun on ${{ matrix.os }}
    needs: registry
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Create package.json
        run: bun init -y

      - name: Install published package
        run: bun add --ignore-scripts "$PACKAGE"

      - name: List installed packages
        run: bun pm ls
