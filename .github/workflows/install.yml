# The workflow to install the package
name: Install

# Controls when the workflow will run
on:
  workflow_run:
    workflows: [ "Publish" ]
    types:
      - completed

jobs:
  install-npm:
    # Run on multiple operating systems and Node.js versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [20, 22, 24]
      fail-fast: false

    steps:
      - name: "Set up Node.js"
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: "Install Nepali Date Converter"
        run: npm init -y && npm install --ignore-scripts @remotemerge/nepali-date-converter

      - name: "List installed packages"
        run: npm list --depth=0

  install-yarn:
    # Run on multiple operating systems and Node.js versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        node-version: [20, 22, 24]
      fail-fast: false

    steps:
      - name: "Set up Node.js"
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: "Install Nepali Date Converter"
        run: npm init -y && yarn add --ignore-scripts @remotemerge/nepali-date-converter

      - name: "List installed packages"
        run: yarn list --depth=0

  install-pnpm:
    # Run on multiple operating systems and Node.js versions
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [20, 22, 24]
      fail-fast: false

    steps:
      - name: "Set up Node.js"
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: "Install pnpm"
        run: npm install -g pnpm@11.17.0

      - name: "Install Nepali Date Converter"
        run: pnpm init && pnpm add --ignore-scripts @remotemerge/nepali-date-converter

      - name: "List installed packages"
        run: pnpm list --depth=0

  install-bun:
    # Run on multiple operating systems
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false

    steps:
      - name: "Set up Bun version 2.2.0"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: "Generate package.json file"
        run: bun init -y

      - name: "Install Nepali Date Converter"
        run: bun add --ignore-scripts @remotemerge/nepali-date-converter

      - name: "List installed packages"
        run: bun pm ls
