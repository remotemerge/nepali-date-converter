[run]
shell = "bun"
bun = false

[test]
coverage = true
coverageReporter = ["text", "lcov"]

[fmt]
singleQuote = true
printWidth = 80
ignorePatterns = [".github/**", "dist/**", "output/**", "public/**"]

[[fmt.overrides]]
files = ["**/*.scss", "**/*.css", "**/*.html", "**/*.yml"]
options = { singleQuote = false }
